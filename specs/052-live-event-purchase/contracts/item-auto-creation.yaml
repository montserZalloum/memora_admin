# Internal Service Contract: Shared LIVE-EVENT-ACCESS ERPNext Item
# Type: Service item management
# Spec: FR-013 (shared item creation)

service:
  name: ensure_shared_live_event_item
  type: service_function
  module: memora_admin.memora_admin.events.item_sync
  called_by:
    - memora_admin.memora_admin.setup.after_migrate (eagerly)
    - memora_admin.memora_admin.services.premium.event_purchase._create_purchase_invoice (lazily)

description: |
  All paid Live Challenge Events share a single ERPNext Item (LIVE-EVENT-ACCESS)
  on invoices and credit notes. Event-specific details are captured in the
  invoice line item description field.
  Idempotent: frappe.db.exists() prevents duplicate creation.

constants:
  LIVE_EVENT_ITEM_CODE: "LIVE-EVENT-ACCESS"

signature:
  function: ensure_shared_live_event_item
  parameters: []

logic:
  - check: "frappe.db.exists('Item', 'LIVE-EVENT-ACCESS')"
  - if_exists: "Return immediately (no-op)"
  - if_not_exists: |
      Create Item via Frappe ORM:
        item_code: LIVE-EVENT-ACCESS
        item_name: "Live Event Access"
        item_group: Services
        stock_uom: Nos
        is_stock_item: 0
        is_sales_item: 1
        include_item_in_manufacturing: 0
        description: "Access ticket for Memora live challenge events"
      Insert with ignore_permissions=True.
      Commit.

invoice_description_format: |
  When creating a Sales Invoice for an event purchase, the line item uses:
    item_code: LIVE-EVENT-ACCESS
    description: "Live Event Ticket: {event_name} ({event_id}) — {scheduled_start}"

credit_note_behavior: |
  Credit notes read item_code and description from the original Sales Invoice.
  This provides backward compatibility: old purchases with per-event item codes
  (LIVE-EVENT-{event_name}) continue to produce correct credit notes.

postconditions:
  - After calling ensure_shared_live_event_item(): LIVE-EVENT-ACCESS Item exists in ERPNext
  - No per-event Items are created

idempotency: |
  The frappe.db.exists() check prevents duplicate item creation.
  Multiple calls result in exactly one ERPNext Item.

migration: |
  Old per-event items (LIVE-EVENT-{event_name}) remain in ERPNext for existing
  invoice references. No cleanup is needed — they are simply no longer created.
