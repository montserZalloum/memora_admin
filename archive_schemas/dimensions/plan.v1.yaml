entity: plan
version: v1
source_table: "tabMemora Academic Plan"
id_column: name
fields:
  - plan_id
  - plan_name
  - grade
  - major
  - season
  - season_title
  - is_published
query: >
  SELECT
    p.`name` AS plan_id,
    p.`plan_name`,
    p.`grade`,
    p.`major`,
    p.`season`,
    s.`season_title`,
    p.`is_published`
  FROM `tabMemora Academic Plan` p
  LEFT JOIN `tabMemora Season` s ON p.`season` = s.`name`
  WHERE p.`name` IN ({placeholders})
