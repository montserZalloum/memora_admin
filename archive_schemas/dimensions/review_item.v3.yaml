entity: review_item
version: v3
source_table: "tabMemora Review Item"
id_column: item_id
fields:
  - item_id
  - subject
  - subject_title
  - topic
  - topic_title
  - lesson
  - lesson_title
  - question_text
  - difficulty
query: >
  SELECT
    ri.`item_id`,
    ri.`subject`,
    subj.`subject_title`,
    ri.`topic`,
    tpc.`topic_title`,
    ri.`lesson`,
    les.`lesson_title`,
    ri.`question_text`,
    NULL AS difficulty
  FROM `tabMemora Review Item` ri
  LEFT JOIN `tabMemora Subject` subj ON ri.`subject` = subj.`name`
  LEFT JOIN `tabMemora Topic` tpc ON ri.`topic` = tpc.`name`
  LEFT JOIN `tabMemora Lesson` les ON ri.`lesson` = les.`name`
  WHERE ri.`item_id` IN ({placeholders})
