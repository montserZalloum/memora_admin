# Subjects export schema — US3
# Mode: full_snapshot — all subject records regardless of published status (FR-012).

dataset: subjects
output_file: subjects.parquet
mode: full_snapshot
primary_key:
  - id

sql_full: >-
  SELECT `name` AS id, `subject_title` AS name
  FROM `tabMemora Subject`
  ORDER BY `name`

columns:
  - {name: id,   type: VARCHAR}
  - {name: name, type: VARCHAR}

dq_rules:
  - {id: DQ-SU-01, type: unique_key, columns: [id]}
  - {id: DQ-SU-02, type: not_null,   column: id}
  - {id: DQ-SU-03, type: min_rows,   min: 1}
