# Item Mapping export schema — US2
# Mode: full_snapshot
#   All review items with complete curriculum hierarchy assignments.
#   Items with null/empty lesson, topic, unit, track, or subject are excluded (FR-007).

dataset: item_mapping
output_file: item_mapping.parquet
mode: full_snapshot
primary_key:
  - item_id

sql_full: >-
  SELECT `item_id`,
         `lesson`  AS lesson_id,
         `topic`   AS topic_id,
         `unit`    AS unit_id,
         `track`   AS track_id,
         `subject` AS subject_id
  FROM `tabMemora Review Item`
  WHERE `lesson`  IS NOT NULL AND `lesson`  != ''
    AND `topic`   IS NOT NULL AND `topic`   != ''
    AND `unit`    IS NOT NULL AND `unit`    != ''
    AND `track`   IS NOT NULL AND `track`   != ''
    AND `subject` IS NOT NULL AND `subject` != ''
  ORDER BY `item_id`

columns:
  - {name: item_id,    type: VARCHAR}
  - {name: lesson_id,  type: VARCHAR}
  - {name: topic_id,   type: VARCHAR}
  - {name: unit_id,    type: VARCHAR}
  - {name: track_id,   type: VARCHAR}
  - {name: subject_id, type: VARCHAR}

dq_rules:
  - {id: DQ-IM-01, type: unique_key, columns: [item_id]}
  - {id: DQ-IM-02, type: not_null,   column: item_id}
  - {id: DQ-IM-03, type: not_null,   column: lesson_id}
  - {id: DQ-IM-04, type: not_null,   column: subject_id}
