# Topics export schema — US3
# Mode: full_snapshot — all topic records regardless of published status (FR-012).

dataset: topics
output_file: topics.parquet
mode: full_snapshot
primary_key:
  - id

sql_full: >-
  SELECT `name` AS id, `topic_title` AS name, `unit` AS unit_id,
         `track` AS track_id, `subject` AS subject_id
  FROM `tabMemora Topic`
  ORDER BY `name`

columns:
  - {name: id,         type: VARCHAR}
  - {name: name,       type: VARCHAR}
  - {name: unit_id,    type: VARCHAR}
  - {name: track_id,   type: VARCHAR}
  - {name: subject_id, type: VARCHAR}

dq_rules:
  - {id: DQ-TP-01, type: unique_key, columns: [id]}
  - {id: DQ-TP-02, type: not_null,   column: id}
  - {id: DQ-TP-03, type: not_null,   column: unit_id}
