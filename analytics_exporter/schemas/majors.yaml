# Majors export schema — US4
# Mode: full_snapshot — all major records (FR-015).

dataset: majors
output_file: majors.parquet
mode: full_snapshot
primary_key:
  - id

sql_full: >-
  SELECT `name` AS id, `major_title` AS name
  FROM `tabMemora Major`
  ORDER BY `name`

columns:
  - {name: id,   type: VARCHAR}
  - {name: name, type: VARCHAR}

dq_rules:
  - {id: DQ-MJ-01, type: unique_key, columns: [id]}
  - {id: DQ-MJ-02, type: not_null,   column: id}
  - {id: DQ-MJ-03, type: min_rows,   min: 1}
