# Units export schema — US3
# Mode: full_snapshot — all unit records regardless of published status (FR-012).

dataset: units
output_file: units.parquet
mode: full_snapshot
primary_key:
  - id

sql_full: >-
  SELECT `name` AS id, `unit_title` AS name, `track` AS track_id, `subject` AS subject_id
  FROM `tabMemora Unit`
  ORDER BY `name`

columns:
  - {name: id,         type: VARCHAR}
  - {name: name,       type: VARCHAR}
  - {name: track_id,   type: VARCHAR}
  - {name: subject_id, type: VARCHAR}

dq_rules:
  - {id: DQ-UN-01, type: unique_key, columns: [id]}
  - {id: DQ-UN-02, type: not_null,   column: id}
  - {id: DQ-UN-03, type: not_null,   column: track_id}
