# Grades export schema — US4
# Mode: full_snapshot — all grade records (FR-014).

dataset: grades
output_file: grades.parquet
mode: full_snapshot
primary_key:
  - id

sql_full: >-
  SELECT `name` AS id, `grade_title` AS name, `sort_order`
  FROM `tabMemora Grade`
  ORDER BY `sort_order`

columns:
  - {name: id,         type: VARCHAR}
  - {name: name,       type: VARCHAR}
  - {name: sort_order, type: INT}

dq_rules:
  - {id: DQ-GR-01, type: unique_key, columns: [id]}
  - {id: DQ-GR-02, type: not_null,   column: id}
  - {id: DQ-GR-03, type: min_rows,   min: 1}
