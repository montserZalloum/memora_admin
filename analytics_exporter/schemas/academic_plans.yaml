# Academic Plans export schema — US4
# Mode: full_snapshot — all plans including drafts (is_published=0) per FR-019.

dataset: academic_plans
output_file: academic_plans.parquet
mode: full_snapshot
primary_key:
  - id

sql_full: >-
  SELECT `name` AS id, `plan_name` AS name, `season`, `grade`, `major`, `is_published`
  FROM `tabMemora Academic Plan`
  ORDER BY `name`

columns:
  - {name: id,           type: VARCHAR}
  - {name: name,         type: VARCHAR}
  - {name: season,       type: VARCHAR}
  - {name: grade,        type: VARCHAR}
  - {name: major,        type: VARCHAR}
  - {name: is_published, type: INT}

dq_rules:
  - {id: DQ-AP-01, type: unique_key, columns: [id]}
  - {id: DQ-AP-02, type: not_null,   column: id}
  - {id: DQ-AP-03, type: not_null,   column: season}
  - {id: DQ-AP-04, type: not_null,   column: grade}
  - {id: DQ-AP-05, type: not_null,   column: major}
