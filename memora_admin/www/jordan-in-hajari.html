<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>رحلة المُنقِّب — الأردنّ في العصور الحجرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2e1c10; --bg2:#5c3a1e; --bg3:#3b2415;
    --card:#ffffff; --ink:#2b1a0e;
    --p:#b45309; --p2:#d97706;
    --good:#22c55e; --bad:#ef4444;
    --gold:#fbbf24; --gem:#22d3ee;
    --soft:#fdf0e0;
    --line:#e9d5bd;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Cairo','Tahoma','Segoe UI',sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    color:var(--ink);
    overflow:hidden; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  .bgsym{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  .bgsym span{position:absolute; color:#ffffff10; font-weight:900; animation:floaty linear infinite;}
  @keyframes floaty{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-20vh) rotate(360deg)}}

  #app{
    position:relative; z-index:2;
    width:min(440px,100vw); height:min(880px,100vh);
    background:linear-gradient(180deg,#fffaf3,#f6e9d6);
    border-radius:28px; overflow:hidden;
    box-shadow:0 30px 80px #0008, inset 0 0 0 6px #ffffff10;
    display:flex; flex-direction:column;
  }
  @media (max-width:460px){ #app{width:100vw;height:100vh;border-radius:0;} }

  #hud{
    display:flex; align-items:center; gap:8px; padding:12px 14px;
    background:linear-gradient(90deg,var(--p),var(--p2));
    color:#fff; box-shadow:0 6px 18px #b4530955; z-index:5;
  }
  .pill{background:#ffffff25; border-radius:999px; padding:6px 12px; font-weight:900; font-size:15px; display:flex; align-items:center; gap:5px; backdrop-filter:blur(4px);}
  #xpwrap{flex:1; height:14px; background:#ffffff30; border-radius:999px; overflow:hidden;}
  #xpbar{height:100%; width:0%; background:linear-gradient(90deg,#fff,#fde68a); border-radius:999px; transition:width .5s cubic-bezier(.2,1,.3,1);}
  #soundBtn{cursor:pointer; font-size:20px; background:#ffffff25; border:none; color:#fff; width:38px;height:38px;border-radius:50%;}

  #screen{flex:1; position:relative; overflow:hidden;}
  .view{position:absolute; inset:0; display:flex; flex-direction:column; padding:18px; overflow-y:auto; animation:slideIn .45s cubic-bezier(.2,1,.3,1);}
  @keyframes slideIn{from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:none}}

  .mascot{width:96px;height:96px; flex:none; filter:drop-shadow(0 8px 12px #b4530955); animation:bob 2.4s ease-in-out infinite;}
  .mascot.small{width:64px;height:64px;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .bubble{background:#fff; border:3px solid var(--line); border-radius:20px; padding:14px 16px; font-size:18px; font-weight:700; line-height:1.9; box-shadow:0 8px 20px #b4530922; position:relative;}
  .bubble:after{content:""; position:absolute; bottom:-14px; right:36px; border:8px solid transparent; border-top-color:#fff;}

  h1.title{font-size:26px; font-weight:900; color:var(--p); margin:6px 0; text-align:center; line-height:1.4;}
  .sub{text-align:center; color:#8a5a2b; font-weight:700; margin-bottom:8px;}

  .btn{
    border:none; border-radius:18px; padding:16px; font-family:inherit;
    font-size:20px; font-weight:900; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,var(--p2),var(--p));
    box-shadow:0 6px 0 #92400e, 0 10px 18px #b4530955;
    transition:transform .08s, box-shadow .08s; width:100%;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #92400e;}
  .btn.gold{background:linear-gradient(180deg,#fcd34d,var(--gold)); color:#5b3d00; box-shadow:0 6px 0 #b45309,0 10px 18px #f59e0b66;}
  .btn.ghost{background:#fff; color:var(--p); box-shadow:0 4px 0 var(--line);}

  .card{background:#fff; border-radius:22px; padding:18px; box-shadow:0 10px 26px #b4530918; margin-top:auto;}

  .opts{display:grid; gap:12px; margin-top:14px;}
  .opt{
    background:#fff; border:3px solid var(--line); border-radius:18px; padding:15px 16px;
    font-size:19px; font-weight:900; color:var(--ink); cursor:pointer;
    transition:transform .1s, border-color .1s, background .1s; text-align:center; line-height:1.6;
    box-shadow:0 4px 0 var(--line);
  }
  .opt:active{transform:translateY(3px); box-shadow:none;}
  .opt.good{border-color:var(--good); background:#dcfce7; box-shadow:0 4px 0 #86efac; animation:pop .4s;}
  .opt.bad{border-color:var(--bad); background:#fee2e2; box-shadow:0 4px 0 #fca5a5; animation:shake .4s;}
  .opt.dim{opacity:.45;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .prompt{font-size:21px; font-weight:900; text-align:center; margin:8px 0; line-height:1.7;}

  .hint{background:var(--soft); border-radius:14px; padding:10px 14px; font-weight:700; color:#92400e; text-align:center; margin:8px 0; line-height:1.8;}
  .keybox{background:#fffbeb; border:2px dashed var(--p2); border-radius:14px; padding:12px 14px; font-weight:900; color:#92400e; text-align:center; margin:10px 0; line-height:1.9; font-size:18px;}

  /* steps panel */
  .steps{background:#fff; border:3px solid var(--line); border-radius:16px; padding:14px; margin:8px 0; box-shadow:0 6px 16px #b4530918;}
  .steprow{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed var(--line); font-weight:800; font-size:16px; line-height:1.8;}
  .steprow:last-child{border-bottom:none;}
  .stepno{flex:none; width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;}

  /* timeline */
  .tl{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 6px 16px #b4530918;}
  .tlrow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:12px;margin:4px 0;color:#fff;font-weight:900;font-size:15px;box-shadow:0 3px 8px #0002;}
  .tlrow .ic{font-size:20px}
  .tlrow .rg{margin-inline-start:auto;font-size:12px;font-weight:800;background:#00000026;padding:3px 8px;border-radius:999px}
  .tlcap{text-align:center;font-weight:900;color:var(--p);font-size:13px;margin-top:6px;line-height:1.6}

  /* map */
  .diagram{display:flex;flex-direction:column;align-items:center;margin:12px 0;}
  svg.fig{max-width:300px;width:100%;height:auto;background:#fff;border-radius:16px;box-shadow:0 8px 20px #b4530918;padding:6px;}
  .dimlabel{font-weight:900;color:var(--p);font-size:13px;margin-top:8px;text-align:center;line-height:1.6;}

  /* achievements grid */
  .achg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;}
  .ach{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;font-weight:900;font-size:14px;color:var(--ink);line-height:1.6;box-shadow:0 4px 12px #b4530914;}
  .ach .e{font-size:30px;display:block;margin-bottom:4px}

  #fb{position:absolute; left:0; right:0; bottom:0; transform:translateY(110%); transition:transform .4s cubic-bezier(.2,1,.3,1);
      background:#fff; border-radius:24px 24px 0 0; padding:18px; box-shadow:0 -10px 30px #0002; z-index:8;}
  #fb.show{transform:none;}
  #fb.win{background:#dcfce7;} #fb.lose{background:#fee2e2;}
  #fb .ttl{font-size:22px; font-weight:900; display:flex; align-items:center; gap:8px;}
  #fb .exp{font-weight:700; color:#5b3d22; margin:8px 0 14px; line-height:1.9; font-size:16px;}

  .path{flex:1; display:flex; flex-direction:column; align-items:center; gap:0; position:relative; padding-top:6px;}
  .node{width:84px;height:84px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:34px;
         font-weight:900; color:#fff; position:relative; cursor:pointer; box-shadow:0 6px 0 #00000022, 0 10px 20px #0003; transition:transform .12s;}
  .node:active{transform:scale(.94);}
  .node.locked{background:#c9b49c; box-shadow:0 6px 0 #a8927a; cursor:not-allowed;}
  .node.done{background:linear-gradient(180deg,#f59e0b,#d97706); box-shadow:0 6px 0 #b45309;}
  .node.cur{background:linear-gradient(180deg,var(--p2),var(--p)); box-shadow:0 6px 0 #92400e; animation:beat 1.4s infinite;}
  .node.boss{background:linear-gradient(180deg,#fb7185,#e11d48); box-shadow:0 6px 0 #9f1239;}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .node .nm{position:absolute; bottom:-26px; font-size:12px; color:#5b3d22; font-weight:900; white-space:nowrap; background:#fff8; padding:2px 8px;border-radius:8px;}
  .node .stars{position:absolute; top:-14px; font-size:14px;}
  .connector{width:6px;height:34px;background:#e3cdb0;border-radius:999px;}
  .connector.done{background:#f59e0b;}
  .nodeoff{margin-inline-start:var(--off,0);}

  .confetti{position:fixed; top:-20px; font-size:22px; z-index:99; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.2}}

  .cert{background:linear-gradient(180deg,#fffdf7,#f7ecd8); border:5px double var(--gold); border-radius:20px; padding:22px; text-align:center; box-shadow:0 14px 30px #d9770633;}
  .cert h2{color:#92400e; margin:6px 0; font-size:23px;}
  .cert .big{font-size:60px;}
  .badge{font-size:80px; text-align:center; animation:bob 2s infinite;}
</style>
</head>
<body>
<div class="bgsym" id="bgsym"></div>

<div id="app">
  <div id="hud">
    <button id="soundBtn" title="الصوت">🔊</button>
    <div class="pill">🏺 <span id="gems">0</span></div>
    <div id="xpwrap"><div id="xpbar"></div></div>
    <div class="pill">⭐ <span id="stars">0</span></div>
  </div>
  <div id="screen"></div>
  <div id="fb">
    <div class="ttl" id="fbttl"></div>
    <div class="exp" id="fbexp"></div>
    <button class="btn" id="fbbtn">متابعة</button>
  </div>
</div>

<script>
/* ============================ شخصية المرشد (نبيه المُنقِّب) ============================ */
function mascot(cls){return `
<svg class="mascot ${cls||''}" viewBox="0 0 120 120">
  <!-- قبّعة المستكشف -->
  <ellipse cx="60" cy="40" rx="42" ry="10" fill="#a16207"/>
  <path d="M30 40 Q30 16 60 16 Q90 16 90 40 Z" fill="#ca8a04"/>
  <rect x="30" y="36" width="60" height="7" rx="3" fill="#854d0e"/>
  <!-- الجسم -->
  <rect x="24" y="46" width="72" height="58" rx="20" fill="#b45309"/>
  <rect x="24" y="46" width="72" height="58" rx="20" fill="url(#g)" opacity=".4"/>
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <!-- العينان -->
  <circle cx="48" cy="68" r="11" fill="#fff"/><circle cx="74" cy="68" r="11" fill="#fff"/>
  <circle cx="50" cy="70" r="5.5" fill="#2b1a0e"/><circle cx="76" cy="70" r="5.5" fill="#2b1a0e"/>
  <circle cx="52" cy="68" r="2" fill="#fff"/><circle cx="78" cy="68" r="2" fill="#fff"/>
  <path d="M49 88 Q61 98 73 88" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- عدسة مكبّرة شارة -->
  <circle cx="92" cy="92" r="9" fill="none" stroke="#fde68a" stroke-width="3"/>
  <line x1="99" y1="99" x2="108" y2="108" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
</svg>`;}

/* ============================ الأصوات ============================ */
let AC=null, soundOn=true;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function tone(f,d,t,v){ if(!soundOn||!ac())return; const o=ac().createOscillator(),g=ac().createGain();
  o.type=t||'sine'; o.frequency.value=f; o.connect(g); g.connect(ac().destination);
  const n=ac().currentTime; g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(v||.18,n+.02);
  g.gain.exponentialRampToValueAtTime(.0001,n+d); o.start(n); o.stop(n+d); }
function sGood(){ [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.2),i*70)); }
function sBad(){ tone(180,.3,'sawtooth',.12); setTimeout(()=>tone(120,.3,'sawtooth',.12),120); }
function sTap(){ tone(494,.08,'square',.07); }
function sWin(){ [523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.2),i*120)); }
function sLevel(){ [659,880,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.18),i*90)); }

/* ============================ مؤثرات ============================ */
function confetti(n){ const e=['🎉','⭐','✨','🏺','🗿','📜','⛏️']; for(let i=0;i<(n||30);i++){
  const c=document.createElement('div'); c.className='confetti'; c.textContent=e[i%e.length];
  c.style.left=Math.random()*100+'vw'; c.style.fontSize=(16+Math.random()*22)+'px';
  c.style.animationDuration=(1.4+Math.random()*1.6)+'s'; document.body.appendChild(c);
  setTimeout(()=>c.remove(),3200);} }

/* ============================ الخطّ الزمني ============================ */
const AGES=[
  {name:'العصر الحجري القديم', en:'Palaeolithic',     rg:'2.5 مليون – 20,000 ق.م', c:'#be123c', ic:'🪨'},
  {name:'العصر الحجري الوسيط', en:'Epi-Palaeolithic', rg:'20,000 – 8500 ق.م',      c:'#ea580c', ic:'🏹'},
  {name:'العصر الحجري الحديث', en:'Neolithic',        rg:'8500 – 4500 ق.م',        c:'#ca8a04', ic:'🌾'},
  {name:'العصر الحجري النحاسي',en:'Chalcolithic',     rg:'4500 – 2000 ق.م',        c:'#0d9488', ic:'⚒️'},
  {name:'العصر البرونزي',      en:'Bronze Age',        rg:'2000 – 1200 ق.م',        c:'#92400e', ic:'🏛️'},
];
function timelineFig(hi){
  return `<div class="tl">
    ${AGES.map((a,i)=>`<div class="tlrow" style="background:${a.c};${hi===i?'outline:3px solid #fde68a;transform:scale(1.03)':''}">
      <span class="ic">${a.ic}</span><span>${a.name}</span><span class="rg">${a.rg}</span></div>`).join('')}
    <div class="tlcap">الأقدم في الأعلى ⟵ الأحدث في الأسفل · اختراع الكتابة 3500 ق.م يُنهي عصور ما قبل التاريخ</div>
  </div>`;
}

/* ============================ خريطة الأردنّ المبسّطة ============================ */
const SITES={
  'دوقرة':{x:118,y:150}, 'طبقة فحل':{x:80,y:108}, 'وادي الحسا':{x:115,y:240}, 'اللجّون':{x:98,y:212},
  'عيون الحمام':{x:84,y:96}, 'الأزرق':{x:178,y:152}, 'الخرانة':{x:122,y:170}, 'عين غزال':{x:98,y:152},
  'بسطة':{x:112,y:292}, 'تل أبو الصوّان':{x:92,y:126}, 'وادي فينان':{x:86,y:262},
  'تل الشونة الشمالية':{x:78,y:118}, 'تليلات الغسول':{x:80,y:178}, 'تل أبو حامد':{x:82,y:132},
  'باب الذراع':{x:86,y:224}, 'جاوا':{x:212,y:92}, 'تل السعيدية':{x:80,y:140}
};
function jordanMap(list,note){
  const shape="60,70 150,60 250,36 290,72 250,122 236,176 182,242 140,302 80,360 70,250 58,176";
  const dots=list.map((nm,k)=>{ const s=SITES[nm]; if(!s)return'';
    const lx = s.x>180 ? s.x-8 : s.x+9;
    const anc = s.x>180 ? 'end' : 'start';
    return `<g>
      <circle cx="${s.x}" cy="${s.y}" r="6.5" fill="#be123c" stroke="#fff" stroke-width="2"/>
      <rect x="${anc==='end'?lx-(nm.length*8.2):lx-2}" y="${s.y-11}" width="${nm.length*8.2+6}" height="20" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
      <text x="${lx+2}" y="${s.y+3}" font-size="12" font-weight="900" fill="#92400e" text-anchor="${anc==='end'?'end':'start'}">${nm}</text>
    </g>`;}).join('');
  return `<div class="diagram"><svg class="fig" viewBox="0 0 300 380">
    <polygon points="${shape}" fill="#f3e3c8" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="150" y="345" font-size="13" font-weight="900" fill="#a16207" text-anchor="middle" opacity=".7">الأردنّ (خريطة تقريبية)</text>
    ${dots}
  </svg><div class="dimlabel">${note||'مواقع أثرية على خريطة الأردنّ'}</div></div>`;
}

/* ============================ لوحة الإنجازات الحضارية ============================ */
function achievementsFig(){
  const a=[
    ['🌾','اكتشاف الزراعة وإنتاج الطعام'],['🔥','اكتشاف النار وصهر المعادن'],
    ['✍️','اختراع الكتابة'],['🐎','تدجين الحيوانات واختراع العجلة'],
    ['🏛️','تنظيم المجتمع وظهور السلطتين الدينية والسياسية'],['🗿','تطوّر العمارة والفنون كصناعة التماثيل']
  ];
  return `<div class="achg">${a.map(x=>`<div class="ach"><span class="e">${x[0]}</span>${x[1]}</div>`).join('')}</div>`;
}

/* ============================ الحالة ============================ */
const State={ xp:0, gems:0, stars:0, maxUnlocked:0, levelStars:{} };
try{ const s=JSON.parse(localStorage.getItem('stoneages_jo')); if(s)Object.assign(State,s); }catch(e){}
function save(){ try{localStorage.setItem('stoneages_jo',JSON.stringify(State));}catch(e){} }
function setHUD(){ document.getElementById('gems').textContent=State.gems;
  document.getElementById('stars').textContent=State.stars;
  document.getElementById('xpbar').style.width=Math.min(100,(State.xp%100))+'%'; }
function addXP(n){ State.xp+=n; setHUD(); save(); }

/* ============================ تعريف المراحل ============================ */
/* أنواع الخطوات: story | choice | solve */
const LEVELS=[

 /* ---------- 0: اسم الأردنّ وتقسيم العصور ---------- */
 { name:'البداية', icon:'🧭', steps:[
   {type:'story', say:'مرحبًا أيها المستكشف! ⛏️ أنا <b>نبيه المُنقِّب</b>. سنغوص اليوم في رحلة عبر الزمن لنكتشف <b>الأردنّ في العصور الحجرية</b> — من أقدم البشر حتى أوّل المدن! 🏺'},
   {type:'story', say:'أولًا، من أين جاء اسم <b>الأردنّ</b>؟ 🌊<br>كلمة (Jordan) تتألّف من رافدين شماليين لنهر الأردنّ: <b>(جور: بانياس)</b> و<b>(دان)</b>. وأطلق العرب اسم «الأردنّ» على المنطقة، وهو يعني <b>الشدّة والغَلَبة</b>، ويعني بالآرامية: النهر المتعرّج شديد الانحدار.'},
   {type:'story', say:'استقرّ الإنسان في الأردنّ منذ أقدم العصور. ولماذا؟ 🌿 بسبب عوامل أربعة:', keybox:'اعتدال المناخ · وفرة المياه · التربة الخصبة · الموقع المتوسّط بين الحضارات'},
   {type:'story', say:'يقع الأردنّ في موقع متوسّط بين <b>حضارات بلاد الشام وبلاد الرافدين</b> من جهة، و<b>حضارات شبه الجزيرة العربية ومصر</b> من جهة أخرى. 🗺️'},
   {type:'story', say:'اتّفق علماء الآثار والمؤرّخون على تقسيم العصور القديمة قسمين تسهيلًا للدراسة: 📜', keybox:'عصور ما قبل التاريخ: من نشأة الإنسان حتى اختراع الكتابة\nالعصور التاريخية: ما بعد اختراع الكتابة'},
   {type:'choice', prompt:'ماذا تعني كلمة «الأردنّ» عند العرب؟',

/* ============================ التنقّل ============================ */
const screen=document.getElementById('screen');
function setView(html){ screen.innerHTML=`<div class="view">${html}</div>`; }

function titleScreen(){
  setView(`
    <div style="text-align:center;margin-top:10px">${mascot()}</div>
    <h1 class="title">رحلة المُنقِّب</h1>
    <div class="sub">الأردنّ في العصور الحجرية ⛏️🏺</div>
    <div class="bubble" style="margin:14px 0">سنسافر عبر <b>2.5 مليون سنة</b>! من أوّل البشر الصيّادين، إلى قرى الزراعة، إلى مناجم النحاس، وأخيرًا أوّل المدن. اكتشف <b>المواقع الأثرية</b> و<b>الإنجازات الحضارية</b>! 🗺️</div>
    <div style="margin-top:auto;display:grid;gap:12px">
      <button class="btn gold" id="startBtn">🚀 ابدأ الرحلة</button>
      ${State.maxUnlocked>0?'<button class="btn ghost" id="resetBtn">🔄 إعادة من البداية</button>':''}
    </div>`);
  document.getElementById('startBtn').onclick=()=>{ac(); sLevel(); mapScreen();};
  const r=document.getElementById('resetBtn');
  if(r) r.onclick=()=>{ State.xp=0;State.gems=0;State.stars=0;State.maxUnlocked=0;State.levelStars={}; save(); setHUD(); titleScreen(); };
}

function mapScreen(){
  let html=`<h1 class="title" style="font-size:23px">🗺️ خريطة الرحلة</h1><div class="path">`;
  LEVELS.forEach((lv,i)=>{
    const done=i<State.maxUnlocked, cur=i===State.maxUnlocked, locked=i>State.maxUnlocked;
    const off=[0,40,-40,55,-55,30,-30][i%7];
    const cls=lv.boss?'boss':(done?'done':(cur?'cur':'locked'));
    const st=State.levelStars[i]||0;
    const starsHtml=done?`<div class="stars">${'⭐'.repeat(st)||'⭐'}</div>`:'';
    html+=`<div class="nodeoff" style="--off:${off}px">
      <div class="node ${cls}" data-i="${i}">${locked&&!lv.boss?'🔒':lv.icon}${starsHtml}
        <span class="nm">${i+1}. ${lv.name}</span></div></div>`;
    if(i<LEVELS.length-1) html+=`<div class="connector ${done?'done':''}"></div>`;
  });
  html+=`</div><div style="height:30px"></div>`;
  setView(html);
  screen.querySelectorAll('.node').forEach(n=>{
    const i=+n.dataset.i;
    if(i<=State.maxUnlocked) n.onclick=()=>{ sTap(); startLevel(i); };
  });
}

let cur={level:0, step:0, perfect:true, wrongHere:false};
function startLevel(i){ cur={level:i, step:0, perfect:true, wrongHere:false}; renderStep(); }
function renderStep(){
  const lv=LEVELS[cur.level]; const st=lv.steps[cur.step];
  if(!st){ return finishLevel(); }
  if(st.type==='story') return renderStory(st,lv);
  if(st.type==='solve') return renderSolve(st,lv);
  if(st.type==='choice') return renderChoice(st,lv);
}
function progressTop(lv){
  const pct=Math.round((cur.step)/lv.steps.length*100);
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <button class="opt" style="padding:8px 12px;font-size:18px;box-shadow:none;border-width:2px;width:auto" id="backMap">✕</button>
    <div style="flex:1;height:12px;background:#e3cdb0;border-radius:999px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#d97706,#b45309);border-radius:999px;transition:width .4s"></div></div>
    <div style="font-weight:900;color:#b45309">${cur.step+1}/${lv.steps.length}</div></div>`;
}
function bindBack(){ const b=document.getElementById('backMap'); if(b)b.onclick=()=>{sTap();mapScreen();}; }

function renderStory(st,lv){
  setView(`${progressTop(lv)}
    <div style="display:flex;gap:10px;align-items:flex-end;margin-top:10px">${mascot('small')}
      <div class="bubble" style="flex:1">${st.say}</div></div>
    ${st.keybox?`<div class="keybox">${st.keybox.replace(/\n/g,'<br>')}</div>`:''}
    ${st.diagram||''}
    <div style="margin-top:auto"><button class="btn" id="next">متابعة ⟵</button></div>`);
  bindBack();
  document.getElementById('next').onclick=()=>{ sTap(); cur.step++; renderStep(); };
}

function renderSolve(st,lv){
  setView(`${progressTop(lv)}
    <div class="hint">🔧 ${st.title}</div>
    <div class="steps">
      ${st.rows.map((r,i)=>`<div class="steprow"><div class="stepno">${i+1}</div><div>${r}</div></div>`).join('')}
    </div>
    <div style="margin-top:auto"><button class="btn" id="next">فهمت، تابع ⟵</button></div>`);
  bindBack();
  document.getElementById('next').onclick=()=>{ sTap(); cur.step++; renderStep(); };
}

function renderChoice(st,lv){
  setView(`${progressTop(lv)}
    <div style="display:flex;gap:10px;align-items:flex-end;margin:8px 0 4px">${mascot('small')}
      <div class="bubble" style="flex:1"><div class="prompt" style="margin:0;font-size:19px">${st.prompt}</div></div></div>
    ${st.diagram||st.visual||''}
    <div class="opts" id="opts">
      ${st.options.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>`);
  bindBack();
  cur.wrongHere=false;
  screen.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===st.correct){
        b.classList.add('good'); sGood(); confetti(22);
        screen.querySelectorAll('.opt').forEach(x=>{x.style.pointerEvents='none'; if(x!==b)x.classList.add('dim');});
        const reward=cur.wrongHere?5:15; addXP(reward); showFB(true, st.exp, reward);
      } else {
        b.classList.add('bad'); sBad(); b.classList.add('dim'); b.style.pointerEvents='none';
        cur.wrongHere=true; cur.perfect=false;
      }
    };
  });
}

const fb=document.getElementById('fb');
function showFB(good, exp, reward){
  fb.className=good?'show win':'show lose';
  document.getElementById('fbttl').innerHTML=good?`✅ صحيح! <span style="color:#16a34a">+${reward} XP</span>`:'حاول مجددًا';
  document.getElementById('fbexp').innerHTML=exp||'';
  const btn=document.getElementById('fbbtn'); btn.textContent='متابعة ⟵';
  btn.onclick=()=>{ sTap(); fb.className=''; cur.step++; renderStep(); };
}

function finishLevel(){
  const lv=LEVELS[cur.level];
  const earnedStars=cur.perfect?3:2;
  State.levelStars[cur.level]=Math.max(State.levelStars[cur.level]||0, earnedStars);
  State.stars+= earnedStars; State.gems+=10;
  if(cur.level+1>State.maxUnlocked) State.maxUnlocked=cur.level+1;
  setHUD(); save(); sLevel(); confetti(40);
  if(lv.boss && cur.level===LEVELS.length-1){ return winScreen(); }
  setView(`
    <div style="text-align:center;margin-top:24px">${mascot()}</div>
    <h1 class="title">🎉 اكتملت المرحلة!</h1>
    <div class="card" style="text-align:center;margin-top:14px">
      <div style="font-size:40px">${'⭐'.repeat(earnedStars)}</div>
      <div style="font-weight:900;font-size:22px;color:#b45309;margin-top:8px">${lv.name}</div>
      <div style="margin-top:10px;font-weight:700;color:#8a5a2b">🏺 +10 قطعة أثرية &nbsp;|&nbsp; ⭐ +${earnedStars} نجوم</div>
    </div>
    <div style="margin-top:auto;display:grid;gap:12px">
      <button class="btn gold" id="cont">المرحلة التالية ⟵</button>
      <button class="btn ghost" id="map">🗺️ الخريطة</button>
    </div>`);
  document.getElementById('cont').onclick=()=>{ sTap(); if(cur.level+1<LEVELS.length) startLevel(cur.level+1); else mapScreen(); };
  document.getElementById('map').onclick=()=>{ sTap(); mapScreen(); };
}

function winScreen(){
  sWin(); confetti(80);
  setView(`
    <div class="badge">🏆</div>
    <div class="cert">
      <div class="big">🏺</div>
      <h2>شهادة المؤرّخ الصغير</h2>
      <div style="font-weight:700;color:#92400e;line-height:2">
        أتقنتَ درس <b>الأردنّ في العصور الحجرية</b>:<br>
        العصور الخمسة (قديم · وسيط · حديث · نحاسي · برونزي) ✦ المواقع الأثرية ✦ الإنجازات الحضارية ✦ مظاهر تطوّر الحياة
      </div>
      <div style="margin-top:14px;font-weight:900;color:#92400e;font-size:20px">⭐ ${State.stars} نجمة &nbsp; | &nbsp; 🏺 ${State.gems} قطعة</div>
    </div>
    <div style="margin-top:auto;display:grid;gap:12px">
      <button class="btn gold" id="again">🗺️ العودة للخريطة</button>
    </div>`);
  document.getElementById('again').onclick=()=>{ sTap(); mapScreen(); };
}

/* ============================ التشغيل ============================ */
document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇'; if(soundOn)sTap(); };
(function bg(){ const host=document.getElementById('bgsym'); const sy=['🏺','⛏️','📜','🗿','🔥','🏛️','🌾','🏹','⚒️'];
  for(let i=0;i<14;i++){ const s=document.createElement('span'); s.textContent=sy[i%sy.length];
    s.style.left=Math.random()*100+'vw'; s.style.fontSize=(20+Math.random()*40)+'px';
    s.style.animationDuration=(8+Math.random()*10)+'s'; s.style.animationDelay=(-Math.random()*10)+'s'; host.appendChild(s);} })();
setHUD();
titleScreen();
</script>
</body>
</html>
