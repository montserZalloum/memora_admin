<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>حفنة تمر — رحلة في قصّة الطيّب صالح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2c1c0c; --bg2:#5a3f18; --bg3:#23341f;
    --card:#ffffff; --ink:#3a2a16;
    --p:#9a6a2a; --p2:#c08a3c;
    --good:#16a34a; --bad:#ef4444;
    --gold:#fbbf24; --gem:#22d3ee;
    --soft:#f7eed9;
    --palm:#3f8b3f; --nile:#2b8ca3; --sand:#e3c489; --grief:#b1456b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Cairo','Tahoma','Segoe UI',sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    color:var(--ink);
    overflow:hidden; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  .bgsym{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  .bgsym span{position:absolute; color:#ffffff12; font-weight:900; animation:floaty linear infinite;}
  @keyframes floaty{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-20vh) rotate(360deg)}}

  #app{
    position:relative; z-index:2;
    width:min(440px,100vw); height:min(880px,100vh);
    background:linear-gradient(180deg,#fffaf0,#fdf2dd);
    border-radius:28px; overflow:hidden;
    box-shadow:0 30px 80px #0008, inset 0 0 0 6px #ffffff10;
    display:flex; flex-direction:column;
  }
  @media (max-width:460px){ #app{width:100vw;height:100vh;border-radius:0;} }

  #hud{
    display:flex; align-items:center; gap:8px; padding:12px 14px;
    background:linear-gradient(90deg,var(--p),var(--p2));
    color:#fff; box-shadow:0 6px 18px #9a6a2a55; z-index:5;
  }
  .pill{background:#ffffff25; border-radius:999px; padding:6px 12px; font-weight:900; font-size:15px; display:flex; align-items:center; gap:5px; backdrop-filter:blur(4px);}
  #xpwrap{flex:1; height:14px; background:#ffffff30; border-radius:999px; overflow:hidden;}
  #xpbar{height:100%; width:0%; background:linear-gradient(90deg,#fff,#fde68a); border-radius:999px; transition:width .5s cubic-bezier(.2,1,.3,1);}
  #soundBtn{cursor:pointer; font-size:20px; background:#ffffff25; border:none; color:#fff; width:38px;height:38px;border-radius:50%;}

  #screen{flex:1; position:relative; overflow:hidden;}
  .view{position:absolute; inset:0; display:flex; flex-direction:column; padding:18px; overflow-y:auto; animation:slideIn .45s cubic-bezier(.2,1,.3,1);}
  @keyframes slideIn{from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:none}}

  .mascot{width:96px;height:96px; flex:none; filter:drop-shadow(0 8px 12px #5a3f1844); animation:bob 2.4s ease-in-out infinite;}
  .mascot.small{width:62px;height:62px;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .bubble{background:#fff; border:3px solid #f0dcb8; border-radius:20px; padding:14px 16px; font-size:18px; font-weight:700; line-height:1.95; box-shadow:0 8px 20px #9a6a2a18; position:relative;}
  .bubble:after{content:""; position:absolute; bottom:-14px; right:36px; border:8px solid transparent; border-top-color:#fff;}

  h1.title{font-size:25px; font-weight:900; color:var(--p); margin:6px 0; text-align:center; line-height:1.45;}
  .sub{text-align:center; color:#7a5a2a; font-weight:700; margin-bottom:8px;}

  .btn{
    border:none; border-radius:18px; padding:16px; font-family:inherit;
    font-size:20px; font-weight:900; cursor:pointer; color:#fff;
    background:linear-gradient(180deg,var(--p2),var(--p));
    box-shadow:0 6px 0 #6f4a16, 0 10px 18px #9a6a2a55;
    transition:transform .08s, box-shadow .08s; width:100%;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #6f4a16;}
  .btn.gold{background:linear-gradient(180deg,#fcd34d,var(--gold)); color:#5b3d00; box-shadow:0 6px 0 #b45309,0 10px 18px #f59e0b66;}
  .btn.ghost{background:#fff; color:var(--p); box-shadow:0 4px 0 #f0dcb8;}

  .card{background:#fff; border-radius:22px; padding:18px; box-shadow:0 10px 26px #9a6a2a18; margin-top:auto;}

  .opts{display:grid; gap:12px; margin-top:14px;}
  .opt{
    background:#fff; border:3px solid #f0dcb8; border-radius:18px; padding:15px;
    font-size:19px; font-weight:900; color:var(--ink); cursor:pointer;
    transition:transform .1s, border-color .1s, background .1s; text-align:center; line-height:1.7;
    box-shadow:0 4px 0 #f0dcb8;
  }
  .opt:active{transform:translateY(3px); box-shadow:none;}
  .opt.good{border-color:var(--good); background:#dcfce7; box-shadow:0 4px 0 #86efac; animation:pop .4s;}
  .opt.bad{border-color:var(--bad); background:#fee2e2; box-shadow:0 4px 0 #fca5a5; animation:shake .4s;}
  .opt.dim{opacity:.45;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .prompt{font-size:20px; font-weight:900; text-align:center; margin:8px 0; line-height:1.85;}

  .hint{background:var(--soft); border-radius:14px; padding:10px 14px; font-weight:700; color:#8a5a10; text-align:center; margin:8px 0; line-height:1.85;}

  /* صندوق نصّ مفتاحيّ / مقولة */
  .keybox{background:#fffbeb; border:2px dashed var(--gold); border-radius:14px; padding:14px 16px; font-weight:800; color:#7c4a12; text-align:center; margin:10px 0; line-height:2.05; font-size:17px; font-family:'Amiri','Cairo',serif;}
  .keybox small{display:block;color:#a16207;font-weight:800;font-size:13px;margin-top:8px;font-family:'Cairo',sans-serif;}

  /* نصّ القصّة (ورق) */
  .passage{background:linear-gradient(180deg,#fdf6e6,#f6e8cd); border:2px solid #e3c99a; border-inline-start:6px solid var(--p); border-radius:16px; padding:16px 16px 14px; margin:12px 0; box-shadow:0 6px 16px #6b4a1a1a; position:relative;}
  .passage .ptag{position:absolute; top:-12px; right:16px; background:var(--p); color:#fff; font-size:12px; font-weight:900; padding:3px 11px; border-radius:999px;}
  .passage .ptext{font-size:18px; font-weight:700; line-height:2.15; color:#43320f; font-family:'Amiri','Cairo',serif;}
  .kw{color:#9a3412; font-weight:900; border-bottom:2px dotted #c2410c; padding:0 1px;}

  /* مَعجَم: كلمة ← معنى */
  .gloss{background:#fff; border:2px solid #ecd9b8; border-radius:14px; padding:6px 10px; margin:10px 0; box-shadow:0 4px 12px #6b4a1a12;}
  .grow{display:flex; gap:10px; align-items:flex-start; padding:8px 4px; border-bottom:1px dashed #f0e2c8; font-size:15px; line-height:1.75;}
  .grow:last-child{border-bottom:none;}
  .gw{flex:none; min-width:104px; font-weight:900; color:var(--p);}
  .gm{font-weight:700; color:#5a4a30;}

  /* خطوات / تحليل */
  .steps{background:#fff; border:3px solid #f0dcb8; border-radius:16px; padding:14px; margin:8px 0; box-shadow:0 6px 16px #9a6a2a12;}
  .steprow{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed #f0e2c8; font-weight:800; font-size:16px; line-height:1.85;}
  .steprow:last-child{border-bottom:none;}
  .stepno{flex:none; width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;}

  /* رقائق */
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0;}
  .chip{background:#fff;border:2px solid #ecd9b8;border-radius:999px;padding:8px 14px;font-weight:900;font-size:14px;color:var(--ink);box-shadow:0 3px 0 #ecd9b8;}
  .chip.hl{border-color:var(--p);color:var(--p);box-shadow:0 3px 0 #e7cfa0;}
  .chip.g{border-color:var(--palm);color:#2f6b2f;box-shadow:0 3px 0 #bfe0bf;}

  /* جدول */
  .cmp{width:100%;margin:10px 0;}
  .cmp table{width:100%;border-collapse:collapse;font-weight:800;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px #6b4a1a12;}
  .cmp th,.cmp td{padding:9px 8px;text-align:center;font-size:13.5px;line-height:1.6;border:1px solid #efe6d4;}
  .cmp thead th{color:#fff;font-size:14px;background:var(--p);}
  .cmp td.k{background:#f6efe0;color:#6b4a1a;font-weight:900;}
  .cmp tbody tr:nth-child(even) td{background:#fcf8ef;}

  /* رسوم */
  .diagram{display:flex;flex-direction:column;align-items:center;margin:12px 0;}
  .dimlabel{font-weight:900;color:var(--p);font-size:13px;margin-top:8px;text-align:center;line-height:1.7;}
  svg.fig{max-width:300px;width:100%;height:auto;background:#fff;border-radius:16px;box-shadow:0 8px 20px #6b4a1a14;padding:8px;}

  #fb{position:absolute; left:0; right:0; bottom:0; transform:translateY(110%); transition:transform .4s cubic-bezier(.2,1,.3,1);
      background:#fff; border-radius:24px 24px 0 0; padding:18px; box-shadow:0 -10px 30px #0002; z-index:8;}
  #fb.show{transform:none;}
  #fb.win{background:#dcfce7;} #fb.lose{background:#fee2e2;}
  #fb .ttl{font-size:22px; font-weight:900; display:flex; align-items:center; gap:8px;}
  #fb .exp{font-weight:700; color:#4a3a26; margin:8px 0 14px; line-height:1.95; font-size:16px;}

  .path{flex:1; display:flex; flex-direction:column; align-items:center; gap:0; position:relative; padding-top:6px;}
  .node{width:84px;height:84px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:34px;
         font-weight:900; color:#fff; position:relative; cursor:pointer; box-shadow:0 6px 0 #00000022, 0 10px 20px #0003; transition:transform .12s;}
  .node:active{transform:scale(.94);}
  .node.locked{background:#c4ad86; box-shadow:0 6px 0 #a08a64; cursor:not-allowed;}
  .node.done{background:linear-gradient(180deg,#34d399,#10b981); box-shadow:0 6px 0 #059669;}
  .node.cur{background:linear-gradient(180deg,var(--p2),var(--p)); box-shadow:0 6px 0 #6f4a16; animation:beat 1.4s infinite;}
  .node.boss{background:linear-gradient(180deg,#fb7185,#be123c); box-shadow:0 6px 0 #881337;}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .node .nm{position:absolute; bottom:-24px; font-size:11.5px; color:#f3e7cf; font-weight:900; white-space:nowrap; background:#3a2a1699; padding:2px 8px;border-radius:8px;}
  .node .stars{position:absolute; top:-14px; font-size:14px;}
  .connector{width:6px;height:34px;background:#7a5a32;border-radius:999px;}
  .connector.done{background:#34d399;}
  .nodeoff{margin-inline-start:var(--off,0);}

  .confetti{position:fixed; top:-20px; font-size:22px; z-index:99; pointer-events:none; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.2}}

  .cert{background:linear-gradient(180deg,#fffdf5,#fef3d8); border:5px double var(--gold); border-radius:20px; padding:22px; text-align:center; box-shadow:0 14px 30px #f59e0b33;}
  .cert h2{color:#9a6a2a; margin:6px 0; font-size:22px;}
  .cert .big{font-size:56px;}
  .badge{font-size:80px; text-align:center; animation:bob 2s infinite;}
</style>
</head>
<body>
<div class="bgsym" id="bgsym"></div>

<div id="app">
  <div id="hud">
    <button id="soundBtn" title="الصوت">🔊</button>
    <div class="pill">💎 <span id="gems">0</span></div>
    <div id="xpwrap"><div id="xpbar"></div></div>
    <div class="pill">⭐ <span id="stars">0</span></div>
  </div>
  <div id="screen"></div>
  <div id="fb">
    <div class="ttl" id="fbttl"></div>
    <div class="exp" id="fbexp"></div>
    <button class="btn" id="fbbtn">متابعة</button>
  </div>
</div>

<script>
/* ============================ شخصية المرشد (تُمَيْر — حبّة التمر) ============================ */
function mascot(cls){return `
<svg class="mascot ${cls||''}" viewBox="0 0 120 120">
  <!-- سعف النخيل فوق الرأس -->
  <path d="M58 30 C50 14 34 10 24 14 C40 16 48 22 56 34 Z" fill="#3f8b3f"/>
  <path d="M62 30 C70 14 86 10 96 14 C80 16 72 22 64 34 Z" fill="#357935"/>
  <path d="M59 28 C55 10 48 4 40 4 C50 10 53 18 57 32 Z" fill="#4e9d4e"/>
  <path d="M61 28 C65 10 72 4 80 4 C70 10 67 18 63 32 Z" fill="#3f8b3f"/>
  <rect x="56" y="26" width="8" height="11" rx="3" fill="#6b4f2a"/>
  <!-- جسم التمرة -->
  <ellipse cx="60" cy="76" rx="35" ry="41" fill="#7a4a1e"/>
  <ellipse cx="60" cy="76" rx="35" ry="41" fill="url(#tg)" opacity=".55"/>
  <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf9450"/><stop offset="1" stop-color="#7a4a1e" stop-opacity="0"/></linearGradient></defs>
  <ellipse cx="46" cy="56" rx="9" ry="15" fill="#ffffff" opacity=".18"/>
  <path d="M34 86 Q60 94 86 86" stroke="#5e3514" stroke-width="2" fill="none" opacity=".45"/>
  <path d="M37 98 Q60 105 83 98" stroke="#5e3514" stroke-width="2" fill="none" opacity=".4"/>
  <circle cx="48" cy="72" r="10" fill="#fff"/><circle cx="72" cy="72" r="10" fill="#fff"/>
  <circle cx="50" cy="74" r="5" fill="#2a1a0c"/><circle cx="74" cy="74" r="5" fill="#2a1a0c"/>
  <circle cx="52" cy="72" r="1.9" fill="#fff"/><circle cx="76" cy="72" r="1.9" fill="#fff"/>
  <path d="M50 91 Q60 100 70 91" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>`;}

/* ============================ الأصوات ============================ */
let AC=null, soundOn=true;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} return AC; }
function tone(f,d,t,v){ if(!soundOn||!ac())return; const o=ac().createOscillator(),g=ac().createGain();
  o.type=t||'sine'; o.frequency.value=f; o.connect(g); g.connect(ac().destination);
  const n=ac().currentTime; g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(v||.18,n+.02);
  g.gain.exponentialRampToValueAtTime(.0001,n+d); o.start(n); o.stop(n+d); }
function sGood(){ [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.2),i*70)); }
function sBad(){ tone(180,.3,'sawtooth',.12); setTimeout(()=>tone(120,.3,'sawtooth',.12),120); }
function sTap(){ tone(494,.08,'square',.07); }
function sWin(){ [523,659,784,1047,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.2),i*120)); }
function sLevel(){ [659,880,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22,'triangle',.18),i*90)); }

/* ============================ مؤثرات ============================ */
function confetti(n){ const e=['🎉','⭐','✨','🌴','📜','🌾','📖']; for(let i=0;i<(n||30);i++){
  const c=document.createElement('div'); c.className='confetti'; c.textContent=e[i%e.length];
  c.style.left=Math.random()*100+'vw'; c.style.fontSize=(16+Math.random()*22)+'px';
  c.style.animationDuration=(1.4+Math.random()*1.6)+'s'; document.body.appendChild(c);
  setTimeout(()=>c.remove(),3200);} }

/* ============================ أدوات العرض ============================ */
function passage(html){ return `<div class="passage"><div class="ptag">📜 من القصّة</div><div class="ptext">${html}</div></div>`; }
function glossary(items){ return `<div class="gloss">${items.map(it=>`<div class="grow"><span class="gw">${it[0]}</span><span class="gm">${it[1]}</span></div>`).join('')}</div>`; }
function chips(items){ return `<div class="chips">${items.map(it=>`<span class="chip ${it[1]||''}">${it[0]}</span>`).join('')}</div>`; }
function table(head,rows){ return `<div class="cmp"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===0?'k':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; }

/* مشهد البيئة: المسجد والنهر والنخل */
function palmScene(){ return `<div class="diagram"><svg class="fig" viewBox="0 0 260 150">
  <rect x="0" y="0" width="260" height="150" rx="14" fill="#fcf3e0"/>
  <rect x="0" y="0" width="260" height="96" fill="#cfe9f1" opacity=".55"/>
  <circle cx="210" cy="28" r="14" fill="#fcd34d" opacity=".85"/>
  <path d="M0 112 Q130 98 260 114 L260 150 L0 150 Z" fill="#2b8ca3"/>
  <path d="M0 120 Q130 106 260 122" stroke="#fff" stroke-width="2" fill="none" opacity=".5"/>
  <rect x="22" y="72" width="46" height="40" fill="#ead6ad" stroke="#b08a4a" stroke-width="1.5"/>
  <path d="M20 72 Q45 50 70 72 Z" fill="#cdaa6a"/>
  <rect x="43" y="44" width="4" height="28" fill="#b08a4a"/><circle cx="45" cy="43" r="4.5" fill="#cdaa6a"/>
  <rect x="150" y="58" width="8" height="56" rx="3" fill="#7a4a1e"/>
  <path d="M154 60 C124 56 112 66 102 72" stroke="#3f8b3f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M154 60 C184 56 196 66 206 72" stroke="#3f8b3f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M154 58 C140 46 132 40 120 40" stroke="#357935" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M154 58 C168 46 176 40 188 40" stroke="#357935" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M154 56 C152 44 152 38 152 32" stroke="#4e9d4e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="154" cy="58" r="5" fill="#8d5524"/>
  <rect x="186" y="98" width="64" height="14" rx="3" fill="#cdb46a"/>
  <text x="118" y="142" font-size="11" font-weight="900" text-anchor="middle" fill="#fff">النهر (النيل)</text>
</svg><div class="dimlabel">المسجدُ · النهرُ · الحقلُ والنخلُ — معالمُ حياةِ الطفل</div></div>`; }

/* بطاقة الكاتب */
function authorCard(){ return `<div class="diagram"><svg class="fig" viewBox="0 0 260 170" style="max-width:280px">
  <rect x="10" y="10" width="240" height="150" rx="16" fill="#fff" stroke="var(--p)" stroke-width="2"/>
  <rect x="10" y="10" width="240" height="38" rx="14" fill="var(--p)"/>
  <text x="130" y="35" font-size="16" font-weight="900" text-anchor="middle" fill="#fff">الطّيّب صالح</text>
  <circle cx="58" cy="100" r="32" fill="#f3e6cf" stroke="#cdaa6a" stroke-width="2"/>
  <circle cx="58" cy="88" r="12" fill="#9a6a2a"/>
  <path d="M32 122 Q58 100 84 122 Z" fill="#9a6a2a"/>
  <text x="160" y="78" font-size="13" font-weight="900" text-anchor="middle" fill="#3a2a16">1929 — 2009 م</text>
  <text x="160" y="100" font-size="13" font-weight="900" text-anchor="middle" fill="#2b8ca3">السودان 🇸🇩</text>
  <text x="160" y="128" font-size="12.5" font-weight="900" text-anchor="middle" fill="#9a3412">👑 عبقريُّ الرواية</text>
  <text x="160" y="145" font-size="12.5" font-weight="900" text-anchor="middle" fill="#9a3412">العربيّة</text>
</svg><div class="dimlabel">أديبٌ وروائيٌّ سودانيٌّ</div></div>`; }

/* أرضُ مسعودٍ عبرَ الزمن */
function landBars(){ return `<div class="diagram"><svg class="fig" viewBox="0 0 260 152">
  <text x="130" y="16" font-size="12.5" font-weight="900" text-anchor="middle" fill="#3a2a16">أرضُ مسعودٍ (مئةُ فدّانٍ) عبرَ الزمن</text>
  <text x="10" y="44" font-size="11.5" font-weight="900" fill="#2f6b2f">قبلَ 40 سنة</text>
  <rect x="10" y="50" width="240" height="26" rx="7" fill="#3f8b3f"/>
  <text x="130" y="68" font-size="12" font-weight="900" text-anchor="middle" fill="#fff">كلُّها مِلكُ مسعودٍ 🌴</text>
  <text x="10" y="104" font-size="11.5" font-weight="900" fill="#9a3412">اليومَ</text>
  <clipPath id="lb"><rect x="10" y="110" width="240" height="26" rx="7"/></clipPath>
  <g clip-path="url(#lb)">
    <rect x="10" y="110" width="160" height="26" fill="#9a6a2a"/>
    <rect x="170" y="110" width="80" height="26" fill="#3f8b3f"/>

/* ============================ التنقّل ============================ */
const screen=document.getElementById('screen');
function setView(html){ screen.innerHTML=`<div class="view">${html}</div>`; }

function titleScreen(){
  setView(`
    <div style="text-align:center;margin-top:10px">${mascot()}</div>
    <h1 class="title">حفنةُ تَمْر</h1>
    <div class="sub">رحلةٌ في قصّةِ الطّيّب صالح · الصفّ الحادي عشر 🌴📜</div>
    <div class="bubble" style="margin:14px 0">نبدأُ من <b>الصفر</b>: مين الطّيّب صالح؟ ثمّ نقرأُ القصّةَ <b>مشهدًا مشهدًا</b> ونفهمُ كلَّ كلمة، ونحلِّلُ <b>الشخصيّاتِ والصراعَ والصُّورَ الفنيّةَ</b>، وننقدُها كالأدباء! أنا <b>تُمَيْر</b> رفيقُك 🌴</div>
    <div style="margin-top:auto;display:grid;gap:12px">
      <button class="btn gold" id="startBtn">🚀 ابدأ الرحلة</button>
      ${State.maxUnlocked>0?'<button class="btn ghost" id="resetBtn">🔄 إعادة من البداية</button>':''}
    </div>`);
  document.getElementById('startBtn').onclick=()=>{ac(); sLevel(); mapScreen();};
  const r=document.getElementById('resetBtn');
  if(r) r.onclick=()=>{ State.xp=0;State.gems=0;State.stars=0;State.maxUnlocked=0;State.levelStars={}; save(); setHUD(); titleScreen(); };
}

function mapScreen(){
  let html=`<h1 class="title" style="font-size:23px">🗺️ خريطةُ الرحلة</h1><div class="path">`;
  LEVELS.forEach((lv,i)=>{
    const done=i<State.maxUnlocked, cur=i===State.maxUnlocked, locked=i>State.maxUnlocked;
    const off=[0,42,-42,56,-56,30,-30][i%7];
    const cls=lv.boss?'boss':(done?'done':(cur?'cur':'locked'));
    const st=State.levelStars[i]||0;
    const starsHtml=done?`<div class="stars">${'⭐'.repeat(st)||'⭐'}</div>`:'';
    html+=`<div class="nodeoff" style="--off:${off}px">
      <div class="node ${cls}" data-i="${i}">${locked&&!lv.boss?'🔒':lv.icon}${starsHtml}
        <span class="nm">${i+1}. ${lv.name}</span></div></div>`;
    if(i<LEVELS.length-1) html+=`<div class="connector ${done?'done':''}"></div>`;
  });
  html+=`</div><div style="height:30px"></div>`;
  setView(html);
  screen.querySelectorAll('.node').forEach(n=>{
    const i=+n.dataset.i;
    if(i<=State.maxUnlocked) n.onclick=()=>{ sTap(); startLevel(i); };
  });
}

let cur={level:0, step:0, perfect:true, wrongHere:false};
function startLevel(i){ cur={level:i, step:0, perfect:true, wrongHere:false}; renderStep(); }
function renderStep(){
  const lv=LEVELS[cur.level]; const st=lv.steps[cur.step];
  if(!st){ return finishLevel(); }
  if(st.type==='story') return renderStory(st,lv);
  if(st.type==='solve') return renderSolve(st,lv);
  if(st.type==='choice') return renderChoice(st,lv);
}
function progressTop(lv){
  const pct=Math.round((cur.step)/lv.steps.length*100);
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
    <button class="opt" style="padding:8px 12px;font-size:18px;box-shadow:none;border-width:2px;width:auto" id="backMap">✕</button>
    <div style="flex:1;height:12px;background:#ecdcbf;border-radius:999px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:999px;transition:width .4s"></div></div>
    <div style="font-weight:900;color:var(--p)">${cur.step+1}/${lv.steps.length}</div></div>`;
}
function bindBack(){ const b=document.getElementById('backMap'); if(b)b.onclick=()=>{sTap();mapScreen();}; }

function renderStory(st,lv){
  setView(`${progressTop(lv)}
    <div style="display:flex;gap:10px;align-items:flex-end;margin-top:10px">${mascot('small')}
      <div class="bubble" style="flex:1">${st.say}</div></div>
    ${st.keybox?`<div class="keybox">${st.keybox}</div>`:''}
    ${st.diagram||''}
    <div style="margin-top:auto"><button class="btn" id="next">متابعة ⟵</button></div>`);
  bindBack();
  document.getElementById('next').onclick=()=>{ sTap(); cur.step++; renderStep(); };
}

function renderSolve(st,lv){
  setView(`${progressTop(lv)}
    <div class="hint">🔧 ${st.title}</div>
    <div class="steps">
      ${st.rows.map((r,i)=>`<div class="steprow"><div class="stepno">${i+1}</div><div>${r}</div></div>`).join('')}
    </div>
    ${st.diagram||''}
    <div style="margin-top:auto"><button class="btn" id="next">فهمتُ، تابع ⟵</button></div>`);
  bindBack();
  document.getElementById('next').onclick=()=>{ sTap(); cur.step++; renderStep(); };
}

function renderChoice(st,lv){
  /* نُبعثِرُ ترتيبَ الخيارات بصريًّا مع الاحتفاظ بالفهرس الأصليّ في data-i */
  const order=st.options.map((o,i)=>i);
  for(let k=order.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[j]; order[j]=t; }
  setView(`${progressTop(lv)}
    <div style="display:flex;gap:10px;align-items:flex-end;margin:8px 0 4px">${mascot('small')}
      <div class="bubble" style="flex:1"><div class="prompt" style="margin:0;font-size:19px">${st.prompt}</div></div></div>
    ${st.diagram||st.visual||''}
    <div class="opts" id="opts">
      ${order.map(oi=>`<button class="opt" data-i="${oi}">${st.options[oi]}</button>`).join('')}
    </div>`);
  bindBack();
  cur.wrongHere=false;
  screen.querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const i=+b.dataset.i;
      if(i===st.correct){
        b.classList.add('good'); sGood(); confetti(22);
        screen.querySelectorAll('.opt').forEach(x=>{x.style.pointerEvents='none'; if(x!==b)x.classList.add('dim');});
        const reward=cur.wrongHere?5:15; addXP(reward); showFB(true, st.exp, reward);
      } else {
        b.classList.add('bad'); sBad(); b.classList.add('dim'); b.style.pointerEvents='none';
        cur.wrongHere=true; cur.perfect=false;
      }
    };
  });
}

const fb=document.getElementById('fb');
function showFB(good, exp, reward){
  fb.className=good?'show win':'show lose';
  document.getElementById('fbttl').innerHTML=good?`✅ صحيح! <span style="color:#16a34a">+${reward} XP</span>`:'حاول مجدّدًا';
  document.getElementById('fbexp').innerHTML=exp||'';
  const btn=document.getElementById('fbbtn'); btn.textContent='متابعة ⟵';
  btn.onclick=()=>{ sTap(); fb.className=''; cur.step++; renderStep(); };
}

function finishLevel(){
  const lv=LEVELS[cur.level];
  const earnedStars=cur.perfect?3:2;
  State.levelStars[cur.level]=Math.max(State.levelStars[cur.level]||0, earnedStars);
  State.stars+= earnedStars; State.gems+=10;
  if(cur.level+1>State.maxUnlocked) State.maxUnlocked=cur.level+1;
  setHUD(); save(); sLevel(); confetti(40);
  if(lv.boss && cur.level===LEVELS.length-1){ return winScreen(); }
  setView(`
    <div style="text-align:center;margin-top:24px">${mascot()}</div>
    <h1 class="title">🎉 اكتملت المرحلة!</h1>
    <div class="card" style="text-align:center;margin-top:14px">
      <div style="font-size:40px">${'⭐'.repeat(earnedStars)}</div>
      <div style="font-weight:900;font-size:22px;color:var(--p);margin-top:8px">${lv.name}</div>
      <div style="margin-top:10px;font-weight:700;color:#7a5a2a">💎 +10 جوهرة &nbsp;|&nbsp; ⭐ +${earnedStars} نجوم</div>
    </div>
    <div style="margin-top:auto;display:grid;gap:12px">
      <button class="btn gold" id="cont">المرحلة التالية ⟵</button>
      <button class="btn ghost" id="map">🗺️ الخريطة</button>
    </div>`);
  document.getElementById('cont').onclick=()=>{ sTap(); if(cur.level+1<LEVELS.length) startLevel(cur.level+1); else mapScreen(); };
  document.getElementById('map').onclick=()=>{ sTap(); mapScreen(); };
}

function winScreen(){
  sWin(); confetti(80);
  setView(`
    <div class="badge">🏆</div>
    <div class="cert">
      <div class="big">🌴</div>
      <h2>شهادةُ ناقدِ القصّةِ القصيرةِ</h2>
      <div style="font-weight:700;color:#7a5a10;line-height:2">
        أتقنتَ قصّةَ <b>«حفنة تمر»</b> للطّيّب صالح:<br>
        الكاتبُ وأدبُه ✦ القصّةُ كاملةً ✦ المفرداتُ ✦ الشخصيّاتُ والصراعُ ✦ الصُّورُ الفنيّةُ والرموزُ ✦ النقدُ والتذوُّق
      </div>
      <div style="margin-top:14px;font-weight:900;color:#9a6a2a;font-size:20px">⭐ ${State.stars} نجمة &nbsp; | &nbsp; 💎 ${State.gems} جوهرة</div>
    </div>
    <div style="margin-top:auto;display:grid;gap:12px">
      <button class="btn gold" id="again">🗺️ العودة للخريطة</button>
    </div>`);
  document.getElementById('again').onclick=()=>{ sTap(); mapScreen(); };
}

/* ============================ التشغيل ============================ */
document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇'; if(soundOn)sTap(); };
(function bg(){ const host=document.getElementById('bgsym'); const sy=['🌴','📜','🌾','🐪','🌅','📖','💧','تمر'];
  for(let i=0;i<14;i++){ const s=document.createElement('span'); s.textContent=sy[i%sy.length];
    s.style.left=Math.random()*100+'vw'; s.style.fontSize=(20+Math.random()*40)+'px';
    s.style.animationDuration=(8+Math.random()*10)+'s'; s.style.animationDelay=(-Math.random()*10)+'s'; host.appendChild(s);} })();
setHUD();
titleScreen();
</script>
</body>
</html>
