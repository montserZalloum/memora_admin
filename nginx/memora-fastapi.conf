# Memora FastAPI Upstream Configuration
# Include this file from your Frappe site's nginx config
#
# Usage: Add this line to your Frappe nginx.conf (before server block):
#   include /path/to/memora_admin/nginx/memora-fastapi.conf;
#
# Then add the location block inside your server block.

# FastAPI upstream definition
upstream memora-fastapi {
    server 127.0.0.1:8001 fail_timeout=0;
    keepalive 32;
}

